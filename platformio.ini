; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = Baremetal_ECG/Core/Src

[env:stm32g431cb]
platform     = ststm32
board        = genericSTM32G431CB
framework    = stm32cube
monitor_speed = 115200

board_build.mcu = stm32g431cbux
board_build.f_cpu = 170000000L
upload_protocol = stlink

extra_scripts = platformio_extra.py

build_flags =
    -IBaremetal_ECG/Core/Inc
    -DUSE_HAL_DRIVER
    -DSTM32G431xx
    -DARM_MATH_CM4
    -DCMSIS_DEVICE_HEADER=\"stm32g431xx.h\"
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -O2

lib_deps =
    CMSIS-DSP

[env:stm32g431cb_debug]
extends = stm32g431cb
platform = ststm32
board = genericSTM32G431CB
framework = stm32cube
extra_scripts = platformio_extra.py
build_type = debug
build_unflags =
    -O2
    -Og
    -Os
    -O1
    -O3
debug_tool = stlink
debug_speed = 4000
debug_init_break = tbreak main
build_flags =
    ${env:stm32g431cb.build_flags}
    -O0
    -g3
    -DDEBUG=1
    -DSTM32_DEBUG=1
    -fno-omit-frame-pointer
